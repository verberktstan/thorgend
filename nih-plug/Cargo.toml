[package]
name = "thorgend"
version = "0.1.0"
authors = ["Stan Verberkt <verberktstan@gmail.com>", "davemollen <davemollen@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", features = ["assert_process_allocs", "standalone"] }
thorgend_dsp = { path = "../dsp" }

[workspace]
members = ["xtask"]
